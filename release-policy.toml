schema_version = "algoworlds_release_policy/1"
maximum_archive_bytes = 20971520

[source]
required = [
  "CONTRIBUTING.md",
  "DATA_LICENSE",
  "LICENSE",
  "MANIFEST.in",
  "NOTICE",
  "PUBLIC_RELEASE_MANIFEST.json",
  "README.md",
  "SECURITY.md",
  "benchmark/MANIFEST.json",
  "pyproject.toml",
  "release-policy.toml",
  "scripts/check_public_terminology.py",
  "scripts/check_release_boundary.py",
  "website/docs/assets/ASSETS.json",
]
files = [
  ".gitleaks.toml",
  ".gitignore",
  ".github/dependabot.yml",
  ".github/workflows/pages.yml",
  ".github/workflows/python-ci.yml",
  ".github/workflows/security.yml",
  "CONTRIBUTING.md",
  "DATA_LICENSE",
  "LICENSE",
  "MANIFEST.in",
  "NOTICE",
  "PUBLIC_RELEASE_MANIFEST.json",
  "README.md",
  "SECURITY.md",
  "docs/OPEN_SOURCE_QUICKSTART.md",
  "examples/anthropic-messages.json",
  "examples/openai-compatible.json",
  "examples/openai-responses.json",
  "pyproject.toml",
  "pytest.ini",
  "release-policy.toml",
  "scripts/check_public_terminology.py",
  "scripts/check_release_boundary.py",
  "website/.gitignore",
  "website/.nvmrc",
  "website/README.md",
  "website/astro.config.mjs",
  "website/package-lock.json",
  "website/package.json",
  "website/playwright.config.ts",
  "website/tsconfig.json",
  "website/docs/assets/ASSETS.json",
  "website/docs/assets/brands.md",
  "website/docs/assets/figures.md",
]
patterns = [
  "algoworlds/*.py",
  "benchmark/__init__.py",
  "benchmark/MANIFEST.json",
  "benchmark/cores/__init__.py",
  "benchmark/cores/*/__init__.py",
  "benchmark/cores/*/api.py",
  "benchmark/cores/*/checker.py",
  "benchmark/cores/*/observations.py",
  "benchmark/cores/*/runtime_data.py",
  "benchmark/cores/*/world.py",
  "benchmark/cores/*/instances/arm_0/*.json",
  "benchmark/cores/*/instances/arm_1/*.json",
  "benchmark/cores/*/instances/certificates/*.json",
  "benchmark/cores/*/prompts/*.md",
  "benchmark/cores/*/prompts/*.txt",
  "tests/test_*.py",
  "website/public/*.png",
  "website/public/*.svg",
  "website/public/brands/*.svg",
  "website/public/figures/*.png",
  "website/src/components/*.astro",
  "website/src/content/*.ts",
  "website/src/data/*.json",
  "website/src/data/*.ts",
  "website/src/layouts/*.astro",
  "website/src/pages/*.astro",
  "website/src/styles/*.css",
  "website/src/*.d.ts",
  "website/tests/*.mjs",
  "website/tests/e2e/*.ts",
]

[wheel]
patterns = [
  "algoworlds/*.py",
  "benchmark/__init__.py",
  "benchmark/MANIFEST.json",
  "benchmark/cores/__init__.py",
  "benchmark/cores/*/__init__.py",
  "benchmark/cores/*/api.py",
  "benchmark/cores/*/checker.py",
  "benchmark/cores/*/observations.py",
  "benchmark/cores/*/runtime_data.py",
  "benchmark/cores/*/world.py",
  "benchmark/cores/*/instances/arm_0/*.json",
  "benchmark/cores/*/instances/arm_1/*.json",
  "benchmark/cores/*/instances/certificates/*.json",
  "benchmark/cores/*/prompts/*.md",
  "benchmark/cores/*/prompts/*.txt",
  "algoworlds-*.dist-info/*",
  "algoworlds-*.dist-info/licenses/*",
  "algoworlds-*.data/data/share/algoworlds/examples/*.json",
  "algoworlds-*.data/data/share/doc/algoworlds/*",
]

[sdist]
generated_patterns = [
  "PKG-INFO",
  "algoworlds.egg-info/*",
  "setup.cfg",
]
